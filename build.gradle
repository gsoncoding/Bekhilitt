plugins { id 'fabric-loom' version '1.14.10' }
version = project.mod_version
group = project.maven_group
base { archivesName = 'bekhilitt' }
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods { bekhilitt { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    runs {
        client { runDir 'run/client'; vmArg '-Dbekhilitt.dev=true' }
        server { runDir 'run/server' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
test { useJUnitPlatform() }
