plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = project.mod_version
group = 'dev.bekhilitt'
base { archivesName = 'bekhilitt' }
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets.main.java.srcDir 'src/client/java'
neoForge {
 enable { version = '21.1.219'; disableRecompilation = true }
 runs {
  client { client(); gameDirectory = file('run/client'); programArguments.addAll '--username', 'BekhilittQA', '--width', '1280', '--height', '720'; systemProperty 'bekhilitt.dev', 'true' }
  server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
 }
 mods { bekhilitt { sourceSet sourceSets.main } }
}
dependencies {
 implementation fileTree(dir:'libs',include:['*.jar'])
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
processResources { inputs.property 'version',project.version; filesMatching('META-INF/neoforge.mods.toml') { expand 'version':project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
test { useJUnitPlatform() }
// Plain JUnit tests include Minecraft NBT verification, without launching a game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
